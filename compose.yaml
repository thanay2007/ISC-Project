services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    volumes:
      - verifex-data:/opt/verifex/.verifex
      - ocr-models:/home/verifex/.paddlex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 12
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  verifex-data:
  ocr-models:
